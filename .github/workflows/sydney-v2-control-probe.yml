name: Run StayLong Sydney v2 control probe

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter RUN_STAY_LONG_SYDNEY_CONTROL_PROBE to create and destroy the probe"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: staylong-sydney-v2-control-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Create, test, and destroy stable-provider control
    runs-on: ubuntu-latest
    environment: sandbox
    env:
      COMPONENT_PATH: infra/terraform/components/sydney-v2-control-probe
      PROJECT_CONFIG: stay-long-sydney-v2.json
      ENVIRONMENT_CONFIG: stay-long-sydney-sandbox.json
      SERVICE: staylong-sydney-v2-control-probe
      REGION: australia-southeast1
    steps:
      - uses: actions/checkout@v4
      - name: Confirm disposable control probe
        run: test "${{ inputs.confirmation }}" = "RUN_STAY_LONG_SYDNEY_CONTROL_PROBE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
      - name: Install configuration validator dependency
        run: python -m pip install jsonschema
      - name: Validate fixed stay-long Sydney configuration
        run: |
          PYTHONPATH=src python tools/terraform_config.py \
            --project-config "$PROJECT_CONFIG" \
            --environment-config "$ENVIRONMENT_CONFIG" \
            --output "${RUNNER_TEMP}/terraform-config.json"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_OPERATOR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Initialise and validate the isolated Terraform state
        run: |
          set -euo pipefail
          state_bucket="$(jq -r '.state_bucket_name' "${RUNNER_TEMP}/terraform-config.json")"
          test -n "$state_bucket"
          terraform -chdir="$COMPONENT_PATH" init -input=false \
            -backend-config="bucket=$state_bucket" \
            -backend-config="prefix=staylong/sydney-sandbox/sydney-v2-control-probe"
          terraform -chdir="$COMPONENT_PATH" fmt -check -recursive
          terraform -chdir="$COMPONENT_PATH" validate
      - name: Plan and create the disposable control service
        run: |
          set -euo pipefail
          terraform -chdir="$COMPONENT_PATH" plan -input=false -out=control.tfplan \
            -var="project_config=$PROJECT_CONFIG" \
            -var="environment_config=$ENVIRONMENT_CONFIG"
          terraform -chdir="$COMPONENT_PATH" apply -input=false control.tfplan
      - name: Probe both generated Cloud Run URLs
        run: |
          set -euo pipefail
          service_json="${RUNNER_TEMP}/control-service.json"
          gcloud run services describe "$SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" \
            --format=json > "$service_json"
          mapfile -t service_urls < <(jq -r '
            [
              .status.url,
              (.metadata.annotations["run.googleapis.com/urls"] | fromjson[])
            ] | unique[]
          ' "$service_json")
          test "${#service_urls[@]}" -ge 1
          trace_id="205445aa7843bc8bf206b12000100001"
          successful=0
          for service_url in "${service_urls[@]}"; do
            http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -H "X-Cloud-Trace-Context: ${trace_id}/1;o=1" \
              "$service_url/")"
            echo "Control probe url=$service_url status=$http_status"
            if [[ "$http_status" == "200" ]]; then
              successful=$((successful + 1))
            fi
          done
          test "$successful" = "${#service_urls[@]}"
      - name: Destroy disposable control service
        if: ${{ always() }}
        run: |
          set -euo pipefail
          state_bucket="$(jq -r '.state_bucket_name' "${RUNNER_TEMP}/terraform-config.json")"
          terraform -chdir="$COMPONENT_PATH" init -input=false -reconfigure \
            -backend-config="bucket=$state_bucket" \
            -backend-config="prefix=staylong/sydney-sandbox/sydney-v2-control-probe"
          terraform -chdir="$COMPONENT_PATH" destroy -input=false -auto-approve \
            -var="project_config=$PROJECT_CONFIG" \
            -var="environment_config=$ENVIRONMENT_CONFIG"
