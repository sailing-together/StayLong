name: Run StayLong Sydney v2 control probe

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter RUN_STAY_LONG_SYDNEY_CONTROL_PROBE to create and destroy the probe"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: staylong-sydney-v2-control-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Create, test, and destroy stable-provider control
    runs-on: ubuntu-latest
    environment: sandbox
    env:
      COMPONENT_PATH: infra/terraform/components/sydney-v2-control-probe
      PROJECT_CONFIG: stay-long-sydney-v2.json
      ENVIRONMENT_CONFIG: stay-long-sydney-sandbox.json
      SERVICE: staylong-sydney-v2-control-probe
      APP_SERVICE: staylong-sydney-v2
      REGION: australia-southeast1
      HELLO_IMAGE: gcr.io/google-samples/hello-app:1.0
    steps:
      - uses: actions/checkout@v4
      - name: Confirm disposable control probe
        run: test "${{ inputs.confirmation }}" = "RUN_STAY_LONG_SYDNEY_CONTROL_PROBE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
      - name: Install configuration validator dependency
        run: python -m pip install jsonschema
      - name: Validate fixed stay-long Sydney configuration
        run: |
          PYTHONPATH=src python tools/terraform_config.py \
            --project-config "$PROJECT_CONFIG" \
            --environment-config "$ENVIRONMENT_CONFIG" \
            --output "${RUNNER_TEMP}/terraform-config.json"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_OPERATOR_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Initialise and validate the isolated Terraform state
        run: |
          set -euo pipefail
          state_bucket="$(jq -r '.state_bucket_name' "${RUNNER_TEMP}/terraform-config.json")"
          test -n "$state_bucket"
          terraform -chdir="$COMPONENT_PATH" init -input=false \
            -backend-config="bucket=$state_bucket" \
            -backend-config="prefix=staylong/sydney-sandbox/sydney-v2-control-probe"
          terraform -chdir="$COMPONENT_PATH" fmt -check -recursive
          terraform -chdir="$COMPONENT_PATH" validate
      - name: Switch one service from hello to StayLong and back
        run: |
          set -euo pipefail

          app_service_json="${RUNNER_TEMP}/staylong-service.json"
          app_revision_json="${RUNNER_TEMP}/staylong-revision.json"
          gcloud run services describe "$APP_SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" \
            --format=json > "$app_service_json"
          app_revision="$(jq -r '.status.latestReadyRevisionName' "$app_service_json")"
          test -n "$app_revision"
          gcloud run revisions describe "$app_revision" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="$REGION" \
            --format=json > "$app_revision_json"
          app_image="$(jq -r '.status.imageDigest' "$app_revision_json")"
          case "$app_image" in *@sha256:*) ;; *) exit 1 ;; esac

          apply_image() {
            local image_ref="$1"
            local phase="$2"
            local run_static_server="$3"
            local run_uvicorn_h11="$4"
            local run_minimal_uvicorn="${5:-false}"
            local run_minimal_wsgi="${6:-false}"
            local plan_file="${RUNNER_TEMP}/${phase}.tfplan"
            terraform -chdir="$COMPONENT_PATH" plan -input=false -out="$plan_file" \
              -var="project_config=$PROJECT_CONFIG" \
              -var="environment_config=$ENVIRONMENT_CONFIG" \
              -var="image_ref=$image_ref" \
              -var="run_static_server=$run_static_server" \
              -var="run_uvicorn_h11=$run_uvicorn_h11" \
              -var="run_minimal_uvicorn=$run_minimal_uvicorn" \
              -var="run_minimal_wsgi=$run_minimal_wsgi"
            terraform -chdir="$COMPONENT_PATH" apply -input=false "$plan_file"
            gcloud run services describe "$SERVICE" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="$REGION" \
              --format=json > "${RUNNER_TEMP}/${phase}-service.json"
          }

          probe_phase() {
            local phase="$1"
            local path="$2"
            local mode="$3"
            local service_json="${RUNNER_TEMP}/${phase}-service.json"
            local trace_id="205445aa7843bc8bf206b12000100001"
            mapfile -t routes < <(jq -r '
              [
                {route_kind: "service", url: .status.url},
                (.metadata.annotations["run.googleapis.com/urls"] | fromjson[] |
                  {route_kind: "service", url: .}),
                (.status.traffic[]? | (.uri // .url // empty) |
                  {route_kind: "tagged-revision", url: .})
              ] | unique_by(.url)[] | [.route_kind, .url] | @tsv
            ' "$service_json")
            test "${#routes[@]}" -ge 2
            printf '%s\n' "${routes[@]}" | cut -f1 | grep -qx 'tagged-revision'

            for attempt in $(seq 1 6); do
              local successful=0
              local url_index=0
              for route in "${routes[@]}"; do
                local route_kind
                local service_url
                IFS=$'\t' read -r route_kind service_url <<< "$route"
                local headers="${RUNNER_TEMP}/${phase}-${attempt}-${url_index}.headers"
                local body="${RUNNER_TEMP}/${phase}-${attempt}-${url_index}.body"
                local http_status
                http_status="$(curl --silent --show-error \
                  --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
                  --connect-timeout 10 --max-time 30 \
                  -H "X-Cloud-Trace-Context: ${trace_id}/1;o=1" \
                  "${service_url}${path}")"
                echo "phase=$phase route_kind=$route_kind attempt=$attempt url_index=$url_index status=$http_status body_sha256=$(sha256sum "$body" | cut -d ' ' -f 1)"
                if [[ "$http_status" == "200" ]]; then
                  successful=$((successful + 1))
                fi
                url_index=$((url_index + 1))
              done
              if [[ "$successful" == "${#routes[@]}" ]]; then
                return 0
              fi
              sleep 10
            done

            [[ "$mode" == "record-only" ]]
          }

          apply_image "$HELLO_IMAGE" "hello-before" "false" "false"
          probe_phase "hello-before" "/" "require-200"
          apply_image "$app_image" "staylong-static" "true" "false"
          probe_phase "staylong-static" "/" "record-only"
          apply_image "$app_image" "minimal-uvicorn" "false" "false" "true"
          probe_phase "minimal-uvicorn" "/healthz" "record-only"
          apply_image "$app_image" "minimal-wsgi" "false" "false" "false" "true"
          probe_phase "minimal-wsgi" "/healthz" "record-only"
          apply_image "$app_image" "staylong-h11" "false" "true"
          probe_phase "staylong-h11" "/healthz" "record-only"
          apply_image "$app_image" "staylong" "false" "false"
          probe_phase "staylong" "/healthz" "record-only"
          apply_image "$HELLO_IMAGE" "hello-after" "false" "false"
          probe_phase "hello-after" "/" "require-200"
      - name: Destroy disposable control service
        if: ${{ always() }}
        run: |
          set -euo pipefail
          state_bucket="$(jq -r '.state_bucket_name' "${RUNNER_TEMP}/terraform-config.json")"
          terraform -chdir="$COMPONENT_PATH" init -input=false -reconfigure \
            -backend-config="bucket=$state_bucket" \
            -backend-config="prefix=staylong/sydney-sandbox/sydney-v2-control-probe"
          terraform -chdir="$COMPONENT_PATH" destroy -input=false -auto-approve \
            -var="project_config=$PROJECT_CONFIG" \
            -var="environment_config=$ENVIRONMENT_CONFIG" \
            -var="image_ref=$HELLO_IMAGE" \
            -var="run_static_server=false" \
            -var="run_uvicorn_h11=false" \
            -var="run_minimal_uvicorn=false" \
            -var="run_minimal_wsgi=false"
