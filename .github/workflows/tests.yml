name: Tests and Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: React and TypeScript quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build production bundle
        run: npm run build

  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Run policy evaluation fixtures
        run: PYTHONPATH=src python tools/policy_evaluations.py
      - name: Build Cloud Run image
        run: docker build --tag staylong:test .
      - name: Run container smoke test
        run: |
          set -euo pipefail
          docker run --detach --name staylong-smoke \
            --env STAYLONG_API_TOKEN=ci-smoke-token \
            --publish 8080:8080 \
            staylong:test
          trap 'docker rm --force staylong-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs staylong-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep --fixed-strings '<div id="root"></div>'
          python tools/cloudrun_smoke.py --url http://127.0.0.1:8080 --token ci-smoke-token

  terraform:
    name: Terraform static validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install configuration validator dependency
        run: python -m pip install jsonschema
      - name: Validate Terraform configuration selections
        run: PYTHONPATH=../../src python ../../tools/terraform_config.py --config-root projects/config --project-config staylong.json --environment-config sandbox.json
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialise without backend
        run: |
          while IFS= read -r component; do
            terraform -chdir="$component" init -backend=false -input=false
          done < <(find bootstrap components -name main.tf -exec dirname {} \; | sort)
      - name: Validate
        run: |
          while IFS= read -r component; do
            terraform -chdir="$component" validate
          done < <(find bootstrap components -name main.tf -exec dirname {} \; | sort)

  trivy:
    name: Trivy repository and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem and Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
