name: Terraform sandbox lifecycle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (sandbox only until production is reviewed)"
        required: true
        default: sandbox
        type: choice
        options: [sandbox, sydney-sandbox]
      component:
        description: "Terraform component to operate"
        required: true
        type: choice
        options: [platform, app, probe, sydney-platform, sydney-app, app-canary, sydney-v2-foundation]
      operation:
        description: "Requested Terraform operation"
        required: true
        type: choice
        options: [validate, plan, apply, replace-plan, replace-apply, public-diagnostic, sydney-public-diagnostic, regional-probe, sydney-app-canary, destroy]
      confirmation:
        description: "Enter PLAN_CLOUD_RUN_SERVICE_REPLACE, EXECUTE_CLOUD_RUN_SERVICE_REPLACE, TEMPORARILY_PUBLIC_CLOUD_RUN, TEMPORARILY_PUBLIC_SYDNEY_CLOUD_RUN, RUN_SYDNEY_CLOUD_RUN_PROBE, RUN_SYDNEY_APP_CANARY, or DESTROY_SANDBOX as applicable"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  lifecycle:
    name: ${{ inputs.operation }} ${{ inputs.component }}
    runs-on: ubuntu-latest
    # The sandbox environment is the approval and configuration boundary for
    # mutation. GitHub environment protection should require human approval.
    environment: sandbox
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install configuration validator dependency
        run: python -m pip install jsonschema
      - name: Select validated configuration pair
        id: configuration
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$COMPONENT" == "sydney-v2-foundation" ]]; then
            test "$ENVIRONMENT" = "sydney-sandbox"
            echo "project_config=staylong-sydney-v2.json" >> "$GITHUB_OUTPUT"
          elif [[ "$COMPONENT" == "sydney-platform" || "$COMPONENT" == "sydney-app" || "$COMPONENT" == "app-canary" ]]; then
            test "$ENVIRONMENT" = "sydney-sandbox"
            echo "project_config=staylong-sydney.json" >> "$GITHUB_OUTPUT"
          else
            test "$ENVIRONMENT" = "sandbox"
            echo "project_config=staylong.json" >> "$GITHUB_OUTPUT"
          fi
          echo "environment_config=${ENVIRONMENT}.json" >> "$GITHUB_OUTPUT"
      - name: Validate selected JSON configuration
        run: |
          PYTHONPATH=src python tools/terraform_config.py \
            --project-config "${{ steps.configuration.outputs.project_config }}" \
            --environment-config "${{ steps.configuration.outputs.environment_config }}" \
            --output "${RUNNER_TEMP}/terraform-config.json"
      - name: Read validated state backend configuration
        id: config
        run: |
          echo "state_bucket_name=$(jq -r '.state_bucket_name' "${RUNNER_TEMP}/terraform-config.json")" >> "$GITHUB_OUTPUT"
      - name: Enforce lifecycle guardrails
        env:
          COMPONENT: ${{ inputs.component }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$OPERATION" == "destroy" && "$CONFIRMATION" != "DESTROY_SANDBOX" ]]; then
            echo "Sandbox destroy requires confirmation=DESTROY_SANDBOX."
            exit 1
          fi
          if [[ "$OPERATION" == "replace-plan" ]]; then
            if [[ "$COMPONENT" != "app" || "$CONFIRMATION" != "PLAN_CLOUD_RUN_SERVICE_REPLACE" ]]; then
              echo "Cloud Run replacement plan requires component=app and confirmation=PLAN_CLOUD_RUN_SERVICE_REPLACE."
              exit 1
            fi
          fi
          if [[ "$OPERATION" == "replace-apply" ]]; then
            if [[ "$COMPONENT" != "app" || "$CONFIRMATION" != "EXECUTE_CLOUD_RUN_SERVICE_REPLACE" ]]; then
              echo "Cloud Run replacement apply requires component=app and confirmation=EXECUTE_CLOUD_RUN_SERVICE_REPLACE."
              exit 1
            fi
          fi
          if [[ "$OPERATION" == "public-diagnostic" ]]; then
            if [[ "$COMPONENT" != "app" || "$CONFIRMATION" != "TEMPORARILY_PUBLIC_CLOUD_RUN" ]]; then
              echo "Public diagnostic requires component=app and confirmation=TEMPORARILY_PUBLIC_CLOUD_RUN."
              exit 1
            fi
          fi
          if [[ "$OPERATION" == "sydney-public-diagnostic" ]]; then
            if [[ "$COMPONENT" != "sydney-app" || "$CONFIRMATION" != "TEMPORARILY_PUBLIC_SYDNEY_CLOUD_RUN" ]]; then
              echo "Sydney public diagnostic requires component=sydney-app and confirmation=TEMPORARILY_PUBLIC_SYDNEY_CLOUD_RUN."
              exit 1
            fi
          fi
          if [[ "$OPERATION" == "regional-probe" ]]; then
            if [[ "$COMPONENT" != "probe" || "$CONFIRMATION" != "RUN_SYDNEY_CLOUD_RUN_PROBE" ]]; then
              echo "Regional probe requires component=probe and confirmation=RUN_SYDNEY_CLOUD_RUN_PROBE."
              exit 1
            fi
          fi
          if [[ "$OPERATION" == "sydney-app-canary" ]]; then
            if [[ "$COMPONENT" != "app-canary" || "$CONFIRMATION" != "RUN_SYDNEY_APP_CANARY" ]]; then
              echo "Sydney application canary requires component=app-canary and confirmation=RUN_SYDNEY_APP_CANARY."
              exit 1
            fi
          fi
          if [[ "$COMPONENT" == "sydney-platform" || "$COMPONENT" == "sydney-app" || "$COMPONENT" == "app-canary" || "$COMPONENT" == "sydney-v2-foundation" ]]; then
            if [[ "${{ inputs.environment }}" != "sydney-sandbox" ]]; then
              echo "Sydney components require environment=sydney-sandbox."
              exit 1
            fi
          elif [[ "${{ inputs.environment }}" == "sydney-sandbox" ]]; then
            echo "sydney-sandbox may only operate Sydney-scoped components."
            exit 1
          fi
      - name: Select Terraform identity
        id: identity
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$OPERATION" == "apply" || "$OPERATION" == "replace-apply" || "$OPERATION" == "public-diagnostic" || "$OPERATION" == "sydney-public-diagnostic" || "$OPERATION" == "regional-probe" || "$OPERATION" == "sydney-app-canary" || "$OPERATION" == "destroy" ]]; then
            echo "service_account=${{ vars.GCP_TERRAFORM_OPERATOR_SERVICE_ACCOUNT }}" >> "$GITHUB_OUTPUT"
          else
            echo "service_account=${{ vars.GCP_TERRAFORM_PLANNER_SERVICE_ACCOUNT }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ steps.identity.outputs.service_account }}
      - name: Resolve deployed Sydney application image
        if: ${{ inputs.operation == 'sydney-app-canary' }}
        id: canary
        run: |
          image="$(gcloud run services describe staylong-sydney --project="${{ vars.GCP_PROJECT_ID }}" --region=australia-southeast1 --format='value(spec.template.spec.containers[0].image)')"
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Initialise selected component
        env:
          COMPONENT: ${{ inputs.component }}
          STATE_BUCKET: ${{ steps.config.outputs.state_bucket_name }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          test -n "$STATE_BUCKET"
          terraform -chdir="$component_path" init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=staylong/sandbox/${COMPONENT}"
      - name: Format and validate
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          terraform fmt -check -recursive "$component_path"
          terraform -chdir="$component_path" validate
      - name: Plan
        if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' || inputs.operation == 'replace-plan' || inputs.operation == 'replace-apply' || inputs.operation == 'public-diagnostic' || inputs.operation == 'sydney-public-diagnostic' || inputs.operation == 'regional-probe' || inputs.operation == 'sydney-app-canary' || inputs.operation == 'destroy' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          plan_args=(-input=false -out=tfplan -var="project_config=${{ steps.configuration.outputs.project_config }}" -var="environment_config=${{ steps.configuration.outputs.environment_config }}")
          if [[ "${{ inputs.operation }}" == "replace-plan" || "${{ inputs.operation }}" == "replace-apply" ]]; then
            plan_args+=("-replace=module.service.google_cloud_run_v2_service.this")
          fi
          if [[ "${{ inputs.operation }}" == "public-diagnostic" ]]; then
            plan_args+=("-var=diagnostic_public_invoker=true")
          fi
          if [[ "${{ inputs.operation }}" == "sydney-public-diagnostic" ]]; then
            plan_args+=("-var=diagnostic_public_invoker=true")
          fi
          terraform -chdir="$component_path" plan "${plan_args[@]}"
      - name: Apply reviewed plan
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'replace-apply' || inputs.operation == 'public-diagnostic' || inputs.operation == 'sydney-public-diagnostic' || inputs.operation == 'regional-probe' || inputs.operation == 'sydney-app-canary' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: terraform -chdir="infra/terraform/components/${COMPONENT}" apply -input=false tfplan
      - name: Configure Cloud Run diagnostic client
        if: ${{ inputs.operation == 'public-diagnostic' || inputs.operation == 'sydney-public-diagnostic' || inputs.operation == 'regional-probe' || inputs.operation == 'sydney-app-canary' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Update canary with the exact application image and ephemeral runtime token
        if: ${{ inputs.operation == 'sydney-app-canary' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CANARY_IMAGE: ${{ steps.canary.outputs.image }}
          STAYLONG_API_TOKEN: ${{ secrets.STAYLONG_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CANARY_IMAGE"
          test -n "$STAYLONG_API_TOKEN"
          gcloud run services update staylong-sydney-app-canary \
            --project="$PROJECT_ID" \
            --region=australia-southeast1 \
            --image="$CANARY_IMAGE" \
            --update-env-vars="STAYLONG_API_TOKEN=$STAYLONG_API_TOKEN"
      - name: Probe the temporarily public health endpoint
        if: ${{ inputs.operation == 'public-diagnostic' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe staylong --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$service_url/healthz")"
          echo "Anonymous health endpoint returned HTTP $http_status."
          test "$http_status" = 200
      - name: Probe the temporarily public Sydney health endpoint
        if: ${{ inputs.operation == 'sydney-public-diagnostic' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: australia-southeast1
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe staylong-sydney --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$service_url/healthz")"
          echo "Anonymous Sydney health endpoint returned HTTP $http_status."
          test "$http_status" = 200
      - name: Revoke temporary public invocation
        if: ${{ always() && (inputs.operation == 'public-diagnostic' || inputs.operation == 'sydney-public-diagnostic') }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          component_path="infra/terraform/components/${COMPONENT}"
          revoke_args=(-input=false -out=revoke.tfplan -var="project_config=${{ steps.configuration.outputs.project_config }}" -var="environment_config=${{ steps.configuration.outputs.environment_config }}" -var="diagnostic_public_invoker=false")
          terraform -chdir="$component_path" plan "${revoke_args[@]}"
          terraform -chdir="$component_path" apply -input=false revoke.tfplan
      - name: Probe the disposable Sydney service
        if: ${{ inputs.operation == 'regional-probe' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          service_url="$(gcloud run services describe staylong-sydney-probe --project="$PROJECT_ID" --region=australia-southeast1 --format='value(status.url)')"
          for attempt in $(seq 1 12); do
            http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$service_url/")"
            echo "Sydney probe attempt $attempt returned HTTP $http_status."
            if [[ "$http_status" == 200 ]]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Probe the disposable same-image Sydney application canary
        if: ${{ inputs.operation == 'sydney-app-canary' }}
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          STAYLONG_API_TOKEN: ${{ secrets.STAYLONG_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STAYLONG_API_TOKEN"
          service_url="$(gcloud run services describe staylong-sydney-app-canary --project="$PROJECT_ID" --region=australia-southeast1 --format='value(status.url)')"
          for attempt in $(seq 1 12); do
            http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 -H "X-StayLong-API-Token: $STAYLONG_API_TOKEN" "$service_url/healthz")"
            echo "Sydney same-image application canary attempt $attempt returned HTTP $http_status."
            if [[ "$http_status" == 200 ]]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Destroy disposable Sydney probe
        if: ${{ always() && inputs.operation == 'regional-probe' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          component_path="infra/terraform/components/${COMPONENT}"
          destroy_args=(-input=false -auto-approve -var="project_config=${{ steps.configuration.outputs.project_config }}" -var="environment_config=${{ steps.configuration.outputs.environment_config }}")
          terraform -chdir="$component_path" destroy "${destroy_args[@]}"
      - name: Destroy disposable same-image Sydney application canary
        if: ${{ always() && inputs.operation == 'sydney-app-canary' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          component_path="infra/terraform/components/${COMPONENT}"
          destroy_args=(-input=false -auto-approve -var="project_config=${{ steps.configuration.outputs.project_config }}" -var="environment_config=${{ steps.configuration.outputs.environment_config }}")
          terraform -chdir="$component_path" destroy "${destroy_args[@]}"
      - name: Destroy selected sandbox component
        if: ${{ inputs.operation == 'destroy' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          destroy_args=(-input=false -auto-approve -var="project_config=staylong.json" -var="environment_config=${{ inputs.environment }}.json")
          terraform -chdir="$component_path" destroy "${destroy_args[@]}"
