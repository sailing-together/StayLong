name: Terraform sandbox lifecycle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (sandbox only until production is reviewed)"
        required: true
        default: sandbox
        type: choice
        options: [sandbox]
      component:
        description: "Terraform component to operate"
        required: true
        type: choice
        options: [platform, app]
      operation:
        description: "Requested Terraform operation"
        required: true
        type: choice
        options: [validate, plan, apply, replace-plan, replace-apply, destroy]
      confirmation:
        description: "Enter PLAN_CLOUD_RUN_SERVICE_REPLACE, EXECUTE_CLOUD_RUN_SERVICE_REPLACE, or DESTROY_SANDBOX as applicable"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  lifecycle:
    name: ${{ inputs.operation }} ${{ inputs.component }}
    runs-on: ubuntu-latest
    # The sandbox environment is the approval and configuration boundary for
    # mutation. GitHub environment protection should require human approval.
    environment: sandbox
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install configuration validator dependency
        run: python -m pip install jsonschema
      - name: Validate selected JSON configuration
        run: |
          PYTHONPATH=src python tools/terraform_config.py \
            --project-config staylong.json \
            --environment-config "${{ inputs.environment }}.json" \
            --output "${RUNNER_TEMP}/terraform-config.json"
      - name: Read validated state backend configuration
        id: config
        run: |
          echo "state_bucket_name=$(jq -r '.state_bucket_name' "${RUNNER_TEMP}/terraform-config.json")" >> "$GITHUB_OUTPUT"
      - name: Enforce lifecycle guardrails
        env:
          COMPONENT: ${{ inputs.component }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$OPERATION" == "destroy" && "$CONFIRMATION" != "DESTROY_SANDBOX" ]]; then
            echo "Sandbox destroy requires confirmation=DESTROY_SANDBOX."
            exit 1
          fi
          if [[ "$OPERATION" == "replace-plan" ]]; then
            if [[ "$COMPONENT" != "app" || "$CONFIRMATION" != "PLAN_CLOUD_RUN_SERVICE_REPLACE" ]]; then
              echo "Cloud Run replacement plan requires component=app and confirmation=PLAN_CLOUD_RUN_SERVICE_REPLACE."
              exit 1
            fi
          fi
          if [[ "$OPERATION" == "replace-apply" ]]; then
            if [[ "$COMPONENT" != "app" || "$CONFIRMATION" != "EXECUTE_CLOUD_RUN_SERVICE_REPLACE" ]]; then
              echo "Cloud Run replacement apply requires component=app and confirmation=EXECUTE_CLOUD_RUN_SERVICE_REPLACE."
              exit 1
            fi
          fi
      - name: Select Terraform identity
        id: identity
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$OPERATION" == "apply" || "$OPERATION" == "replace-apply" || "$OPERATION" == "destroy" ]]; then
            echo "service_account=${{ vars.GCP_TERRAFORM_OPERATOR_SERVICE_ACCOUNT }}" >> "$GITHUB_OUTPUT"
          else
            echo "service_account=${{ vars.GCP_TERRAFORM_PLANNER_SERVICE_ACCOUNT }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ steps.identity.outputs.service_account }}
      - name: Initialise selected component
        env:
          COMPONENT: ${{ inputs.component }}
          STATE_BUCKET: ${{ steps.config.outputs.state_bucket_name }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          test -n "$STATE_BUCKET"
          terraform -chdir="$component_path" init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=staylong/sandbox/${COMPONENT}"
      - name: Format and validate
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          terraform fmt -check -recursive "$component_path"
          terraform -chdir="$component_path" validate
      - name: Plan
        if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' || inputs.operation == 'replace-plan' || inputs.operation == 'replace-apply' || inputs.operation == 'destroy' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          plan_args=(-input=false -out=tfplan -var="project_config=staylong.json" -var="environment_config=${{ inputs.environment }}.json")
          if [[ "${{ inputs.operation }}" == "replace-plan" || "${{ inputs.operation }}" == "replace-apply" ]]; then
            plan_args+=("-replace=module.service.google_cloud_run_v2_service.this")
          fi
          terraform -chdir="$component_path" plan "${plan_args[@]}"
      - name: Apply reviewed plan
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'replace-apply' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: terraform -chdir="infra/terraform/components/${COMPONENT}" apply -input=false tfplan
      - name: Destroy selected sandbox component
        if: ${{ inputs.operation == 'destroy' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          component_path="infra/terraform/components/${COMPONENT}"
          destroy_args=(-input=false -auto-approve -var="project_config=staylong.json" -var="environment_config=${{ inputs.environment }}.json")
          terraform -chdir="$component_path" destroy "${destroy_args[@]}"
