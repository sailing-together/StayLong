name: Deploy application revision

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA already reachable from main to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  terraform_readiness:
    name: Verify Terraform-managed platform and service
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLANNER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify Terraform-managed prerequisites
        run: |
          gcloud artifacts repositories describe staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --location="${{ vars.GCP_REGION }}"
          gcloud run services describe staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}"

  deploy:
    name: Build and deploy approved application revision
    needs: terraform_readiness
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Verify deployment commit belongs to main
        id: revision
        run: |
          deployment_sha="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "$deployment_sha" origin/main
          echo "sha=$deployment_sha" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable image
        run: |
          image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/staylong/app:${{ steps.revision.outputs.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker buildx build --tag "$image" --push .
      - name: Publish only the Cloud Run application revision
        env:
          STAYLONG_API_TOKEN: ${{ secrets.STAYLONG_API_TOKEN }}
        run: |
          test -n "$STAYLONG_API_TOKEN" || {
            echo "Configure the sandbox GitHub environment secret STAYLONG_API_TOKEN before deploying." >&2
            exit 1
          }
          gcloud run services update staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/staylong/app:${{ steps.revision.outputs.sha }}" \
            --update-env-vars "STAYLONG_API_TOKEN=$STAYLONG_API_TOKEN"
      - name: Resolve deployed service URL
        id: service
        run: |
          service_url="$(gcloud run services describe staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "Resolved Cloud Run proxy URL: $service_url"
          echo "url=$service_url" >> "$GITHUB_OUTPUT"
      - name: Mint Cloud Run identity token
        id: cloud_run_id_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
      - name: Smoke-test deployed revision
        env:
          STAYLONG_API_TOKEN: ${{ secrets.STAYLONG_API_TOKEN }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.cloud_run_id_token.outputs.id_token }}
        run: |
          test -n "$STAYLONG_API_TOKEN" || {
            echo "Configure the sandbox GitHub environment secret STAYLONG_API_TOKEN before deploying." >&2
            exit 1
          }
          test -n "$CLOUD_RUN_ID_TOKEN" || {
            echo "Could not mint a Cloud Run identity token for the deployed service." >&2
            exit 1
          }
          gcloud components install cloud-run-proxy --quiet
          proxy_port=18080
          gcloud run services proxy staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --port="$proxy_port" \
            --token="$CLOUD_RUN_ID_TOKEN" \
            >"$RUNNER_TEMP/staylong-cloud-run-proxy.log" 2>&1 &
          proxy_pid=$!
          cleanup() { kill "$proxy_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            proxy_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "http://127.0.0.1:${proxy_port}/healthz" || true)"
            if [ "$proxy_status" != "000" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/staylong-cloud-run-proxy.log"
              exit 1
            fi
            sleep 1
          done
          python3 tools/cloudrun_smoke.py \
            --url "http://127.0.0.1:${proxy_port}" \
            --token "$STAYLONG_API_TOKEN" \
            --application-token-header "X-StayLong-API-Token"
