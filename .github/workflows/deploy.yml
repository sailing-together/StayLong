name: Deploy application revision

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA already reachable from main to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  terraform_readiness:
    name: Verify Terraform-managed platform and service
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLANNER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify Terraform-managed prerequisites
        run: |
          gcloud artifacts repositories describe staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --location="${{ vars.GCP_REGION }}"
          gcloud run services describe staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}"

  deploy:
    name: Build and deploy approved application revision
    needs: terraform_readiness
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Verify deployment commit belongs to main
        id: revision
        run: |
          deployment_sha="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "$deployment_sha" origin/main
          echo "sha=$deployment_sha" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable image
        run: |
          image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/staylong/app:${{ steps.revision.outputs.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker buildx build --tag "$image" --push .
      - name: Publish only the Cloud Run application revision
        env:
          STAYLONG_API_TOKEN: ${{ secrets.STAYLONG_API_TOKEN }}
        run: |
          test -n "$STAYLONG_API_TOKEN" || {
            echo "Configure the sandbox GitHub environment secret STAYLONG_API_TOKEN before deploying." >&2
            exit 1
          }
          gcloud run services update staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/staylong/app:${{ steps.revision.outputs.sha }}" \
            --update-env-vars "STAYLONG_API_TOKEN=$STAYLONG_API_TOKEN"
      - name: Resolve deployed service URL
        id: service
        run: |
          service_urls="$(gcloud run services describe staylong \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(metadata.annotations."run.googleapis.com/urls")')"
          service_url="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])[0])' "$service_urls")"
          test -n "$service_url"
          echo "url=$service_url" >> "$GITHUB_OUTPUT"
      - name: Mint Cloud Run identity token
        id: cloud_run_id_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}/
          id_token_include_email: true
      - name: Validate Cloud Run identity token audience
        env:
          CLOUD_RUN_ID_TOKEN: ${{ steps.cloud_run_id_token.outputs.id_token }}
          EXPECTED_AUDIENCE: ${{ steps.service.outputs.url }}/
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["CLOUD_RUN_ID_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          assert claims["aud"] == os.environ["EXPECTED_AUDIENCE"]
          assert claims["email"] == "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"
          PY
      - name: Smoke-test deployed revision
        env:
          STAYLONG_API_TOKEN: ${{ secrets.STAYLONG_API_TOKEN }}
          CLOUD_RUN_ID_TOKEN: ${{ steps.cloud_run_id_token.outputs.id_token }}
        run: |
          test -n "$STAYLONG_API_TOKEN" || {
            echo "Configure the sandbox GitHub environment secret STAYLONG_API_TOKEN before deploying." >&2
            exit 1
          }
          test -n "$CLOUD_RUN_ID_TOKEN" || {
            echo "Could not mint a Cloud Run identity token for the deployed service." >&2
            exit 1
          }
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "${{ steps.service.outputs.url }}/healthz",
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {os.environ['CLOUD_RUN_ID_TOKEN']}",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              assert response.status == 200
              assert json.load(response) == {"status": "ok"}
          PY
          python3 tools/cloudrun_smoke.py \
            --url "${{ steps.service.outputs.url }}" \
            --token "$STAYLONG_API_TOKEN" \
            --id-token "$CLOUD_RUN_ID_TOKEN"
