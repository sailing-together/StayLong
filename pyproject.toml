[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "staylong"
version = "0.1.0"
description = "An event-driven ageing-in-place coordination agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-cloud-firestore>=2.16",
    "google-cloud-secret-manager>=2.20",
    "granian>=2,<3",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["httpx2>=0.1", "jsonschema>=4.23", "pytest>=8.3", "ruff>=0.8"]
agents = ["google-adk[gcp]>=2.0.0,<3.0.0"]
async_dispatch = ["google-cloud-pubsub>=2.28", "google-cloud-tasks>=2.19"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
staylong = ["api/static/*", "api/static/**/*"]
